plugins {
	id 'fabric-loom' version "${loom_version}"
}

base { archivesName = "IceAndFire-Fabric-${project.minecraft_version}" }

loom {
	splitEnvironmentSourceSets()
	accessWidenerPath = file("src/main/resources/iceandfire_fabric.accesswidener")
}

sourceSets {
	// the game tests (server) and the client scenes, as a mod of their own (iceandfire_fabric-test)
	gametest {
		compileClasspath += main.compileClasspath + main.output + client.compileClasspath + client.output
		runtimeClasspath += main.runtimeClasspath + main.output + client.runtimeClasspath + client.output
	}
}

loom {
	mods {
		"iceandfire_fabric" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
		"iceandfire_fabric-test" {
			sourceSet sourceSets.gametest
		}
	}
	runs {
		// gradlew runGametest: the server game tests, then the server stops (report in build/gametest/junit.xml)
		gametest {
			server()
			name "Game Test"
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${project.buildDir}/gametest/junit.xml"
			vmArg "-Xmx2G"
			// -Ponly=taming,throne: only the tests whose names hold one of those words
			vmArg "-Diceandfire_fabric.test.only=${project.findProperty('only') ?: ''}"
			runDir "build/gametest"
			source sourceSets.gametest
		}
		// gradlew runClienttest: the client tests and their screenshots (build/clienttest/screenshots), then the game closes
		clienttest {
			client()
			name "Client Test"
			vmArg "-Diceandfire_fabric.clienttest=true"
			vmArg "-Diceandfire_fabric.test.only=${project.findProperty('only') ?: ''}"
			vmArg "-Xmx3G"
			programArgs "--width", "854", "--height", "480"
			runDir "build/clienttest"
			source sourceSets.gametest
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") { expand "version": version }
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
	it.options.compilerArgs += ['-Xmaxerrs', '100000', '-Xmaxwarns', '0']
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") { rename { "LICENSE_iceandfire_fabric" } }
	from("CREDITS.md")
}

sourcesJar {
	from("LICENSE") { rename { "LICENSE_iceandfire_fabric" } }
	from("CREDITS.md")
}

// production check: the test classes as an intermediary mod jar (build/libs/*-gametest.jar), for tools/prodtest.py
tasks.register('gametestJar', Jar) {
	from sourceSets.gametest.output
	archiveClassifier = 'gametest-dev'
}

tasks.register('remapGametestJar', net.fabricmc.loom.task.RemapJarTask) {
	dependsOn gametestJar
	inputFile = tasks.named('gametestJar').flatMap { it.archiveFile }
	archiveClassifier = 'gametest'
	addNestedDependencies = false
	classpath.from(sourceSets.main.output, sourceSets.client.output)
}
