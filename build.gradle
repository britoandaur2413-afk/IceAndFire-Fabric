plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base { archivesName = "IceAndFire-Fabric-${project.minecraft_version}" }

loom {
	splitEnvironmentSourceSets()
	accessWidenerPath = file("src/main/resources/iceandfire_fabric.classtweaker")
	mods {
		"iceandfire_fabric" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "iceandfire_fabric-test"
		enableGameTests = true
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// The Mod Tester (bots, encounters, error report) for the battle tests, when it is built next to this project.
	def modTester = file("../ModTester-Fabric-26.3/build/libs/modtester-0.1.0.jar")
	if (modTester.exists()) {
		gametestRuntimeOnly files(modTester)
	}
	// Other mods beside it in the test runs, to see that they get on together:
	// gradlew runClientGameTest -PwithMods=<a folder of their jars> (the run's own mods folder is emptied first)
	if (project.hasProperty("withMods")) {
		gametestRuntimeOnly fileTree(dir: project.property("withMods"), include: "*.jar")
	}
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") { expand "version": version }
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
	it.options.compilerArgs += ['-Xmaxerrs', '100000', '-Xmaxwarns', '0']
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") { rename { "LICENSE_iceandfire_fabric" } }
	from("COPYING") { rename { "COPYING_iceandfire_fabric" } }
	from("CREDITS.md")
}

sourcesJar {
	from("LICENSE") { rename { "LICENSE_iceandfire_fabric" } }
	from("COPYING") { rename { "COPYING_iceandfire_fabric" } }
	from("CREDITS.md")
}
